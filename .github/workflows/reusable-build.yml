name: Reusable Build Registry

on:
  workflow_call:
    secrets:
      CNB_TOKEN:
        description: CNB 访问令牌 用于把插件安装包镜像到国内下载源 未配置时跳过镜像
        required: false

env:
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
  BASE_PATH: ${{ vars.SITE_BASE_PATH || '/plugin-data' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 调用方即数据仓（plugin-data）：checkout 默认落在工作区根目录
      - name: Checkout data repository
        uses: actions/checkout@v6

      - name: Checkout tools
        uses: actions/checkout@v6
        with:
          repository: OneDragon-Anyone/plugin-market
          ref: v2
          path: .tools
          persist-credentials: false

      - name: Checkout lock branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin lock >/dev/null; then
            git fetch --depth=1 origin lock:lock
            git worktree add .lock lock
          else
            git worktree add --orphan -b lock .lock
          fi

      - name: Checkout template tools
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.TEMPLATE_REPOSITORY || 'OneDragon-Anyone/plugin-template' }}
          ref: ${{ vars.TEMPLATE_REF || 'v1' }}
          path: .plugin-template
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        working-directory: .tools
        run: pnpm install --frozen-lockfile

      - name: Build registry data
        working-directory: .tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          REGISTRY_DATA_DIR: ${{ github.workspace }}
          LOCK_DIR: ${{ github.workspace }}/.lock
          TEMPLATE_DIR: ${{ github.workspace }}/.plugin-template
          PREVIOUS_API_URL: ${{ env.SITE_URL }}${{ env.BASE_PATH }}/api/v1/
          REGISTRY_OPEN_ISSUES: "true"
        run: pnpm registry:build

      - name: Commit lock branch
        working-directory: .lock
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "lock unchanged"
            exit 0
          fi
          git commit -m "chore: update sources lock (${GITHUB_SHA::7})"
          git push origin lock

      - name: Build site
        working-directory: .tools
        run: pnpm build
        env:
          PUBLIC_GITHUB_OWNER: ${{ github.repository_owner }}
          PUBLIC_GITHUB_REPO: ${{ github.event.repository.name }}
          PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .tools/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
